# LinkMai production stack: Alibaba Cloud ECS + local PostgreSQL + OSS.
#
# Run it through deploy/scripts/compose.sh, which passes --env-file .env.prod.
# `docker compose -f deploy/docker-compose.prod.yml` alone will not see
# .env.prod and every required variable below will fail interpolation.
#
# This file replaces the local Supabase stack in docker-compose.yml:
#   - PostgreSQL runs in this compose file on a named volume (no RDS needed)
#   - no local storage / mailpit / createbucket (OSS and SMTP are managed)
#   - the schema bootstrap still runs from the backend image (db-init)
#   - auth, PostgREST and the Supabase gateway stay on the private network
#   - the edge nginx terminates TLS for the app and proxies /api
#   - storage is Alibaba Cloud OSS through the native adapter
#
# WordPress-style "single host" is intentionally not supported here: OSS's
# default public endpoint rejects new mainland buckets, so the browser must
# use the bucket's custom domain (OSS_PUBLIC_ENDPOINT).

name: linkmai

x-backend-build: &backend-build
  context: ..
  dockerfile: backend/Dockerfile
  args:
    LINKMAI_VERSION: ${LINKMAI_VERSION:-linkmai}
    GIT_SHA: ${GIT_SHA:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "3001"
  TRUST_PROXY_HOPS: "1"

  # Public origins. Production validation rejects http here.
  FRONTEND_URL: "${FRONTEND_URL:?FRONTEND_URL is required (https://linkmai.com)}"
  API_PUBLIC_URL: "${API_PUBLIC_URL:?API_PUBLIC_URL is required (https://linkmai.com/api)}"
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"

  # Supabase Auth + PostgREST through the internal gateway.
  SUPABASE_URL: http://gateway:8000
  SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?run deploy/scripts/generate-secrets.mjs}"
  SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:?run deploy/scripts/generate-secrets.mjs}"

  # Alibaba Cloud OSS (STORAGE_DRIVER=oss in ./lib/storage.ts).
  STORAGE_DRIVER: oss
  OSS_BUCKET_NAME: "${OSS_BUCKET_NAME:?}"
  OSS_REGION: "${OSS_REGION:-cn-hangzhou}"
  OSS_INTERNAL: "${OSS_INTERNAL:-true}"
  OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
  OSS_PUBLIC_ENDPOINT: "${OSS_PUBLIC_ENDPOINT:?set the bucket custom domain, e.g. https://storage.linkmai.com}"
  OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:?}"
  OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:?}"

  # Durable queues. Redis lives in this compose file and is not published.
  REDIS_URL: "redis://:${REDIS_PASSWORD:?run deploy/scripts/generate-secrets.mjs}@redis:6379"
  QUEUE_DRIVER: redis
  WORKERS_MODE: thread
  ASYNC_DOCUMENT_CONVERSION: "true"
  ASYNC_TABULAR_EXTRACTION: "true"

  # Secrets that production refuses to start without.
  DOWNLOAD_SIGNING_SECRET: "${DOWNLOAD_SIGNING_SECRET:?run deploy/scripts/generate-secrets.mjs}"
  USER_API_KEYS_ENCRYPTION_SECRET: "${USER_API_KEYS_ENCRYPTION_SECRET:?run deploy/scripts/generate-secrets.mjs}"

  # Default model: DeepSeek through its OpenAI-compatible endpoint.
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?}"
  DEEPSEEK_SEARCH_API_KEY: "${DEEPSEEK_SEARCH_API_KEY:-}"
  LINKMAI_MODEL_CONFIG_JSON: "${LINKMAI_MODEL_CONFIG_JSON:-}"

  SENTRY_DSN: "${SENTRY_DSN:-}"
  SENTRY_DISABLED: "${SENTRY_DISABLED:-true}"

services:
  # PostgreSQL with the standard Supabase roles. The image creates anon,
  # authenticated, service_role (BYPASSRLS), supabase_auth_admin and
  # authenticator; ./db/init-roles.sh sets the two login passwords.
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run deploy/scripts/generate-secrets.mjs}"
      POSTGRES_DB: postgres
      JWT_SECRET: "${GOTRUE_JWT_SECRET:?run deploy/scripts/generate-secrets.mjs}"
      JWT_EXP: "3600"
      SUPABASE_AUTH_ADMIN_PASSWORD: "${SUPABASE_AUTH_ADMIN_PASSWORD:?run deploy/scripts/generate-secrets.mjs}"
      AUTHENTICATOR_PASSWORD: "${AUTHENTICATOR_PASSWORD:?run deploy/scripts/generate-secrets.mjs}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/zz-linkmai-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  # GoTrue owns auth.users and runs its own migrations on first start.
  auth:
    image: supabase/gotrue:v2.189.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "${FRONTEND_URL:?}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${SUPABASE_AUTH_ADMIN_PASSWORD:?}@db:5432/postgres?sslmode=disable"
      GOTRUE_SITE_URL: "${FRONTEND_URL:?}"
      GOTRUE_URI_ALLOW_LIST: "${FRONTEND_URL:?}/**"
      GOTRUE_JWT_SECRET: "${GOTRUE_JWT_SECRET:?run deploy/scripts/generate-secrets.mjs}"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # The service JWT below carries this role; GoTrue trusts it for admin
      # API calls. service_role has BYPASSRLS in the Supabase image.
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_DISABLE_SIGNUP: "${GOTRUE_DISABLE_SIGNUP:-false}"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: "${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}"
      GOTRUE_EXTERNAL_GOOGLE_SECRET: "${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}"
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: "${FRONTEND_URL:?}/auth/v1/callback"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: "${SMTP_HOST:?}"
      GOTRUE_SMTP_PORT: "${SMTP_PORT:-587}"
      GOTRUE_SMTP_USER: "${SMTP_USER:?}"
      GOTRUE_SMTP_PASS: "${SMTP_PASSWORD:?}"
      GOTRUE_SMTP_ADMIN_EMAIL: "${SMTP_FROM:?}"
      GOTRUE_SMTP_SENDER_NAME: "${SMTP_SENDER_NAME:-灵迈 LinkMai}"
      # Links resolve on the app origin; edge forwards /auth/v1 to the gateway.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # PostgREST is the data API the backend uses; it is never published.
  rest:
    image: postgrest/postgrest:v14.12
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD:?}@db:5432/postgres?sslmode=disable"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "${GOTRUE_JWT_SECRET:?}"
      PGRST_DB_MAX_ROWS: "2000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Internal Supabase gateway: /auth/v1 -> auth, /rest/v1 -> rest.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ../supabase/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - rest
    restart: unless-stopped
    logging: *default-logging

  # One-shot: load schema.sql into the fresh local database, then run migrations.
  # Runs as the postgres superuser so it can create the triggers on auth.users;
  # the backend's service key uses service_role, which has BYPASSRLS.
  db-init:
    build: *backend-build
    image: "${LINKMAI_IMAGE_REPO:-linkmai}/linkmai-backend:${LINKMAI_IMAGE_TAG:-prod}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      DB: "postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/postgres?sslmode=disable"
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/postgres?sslmode=disable"
      MIGRATIONS_DIR: /app/migrations
      MIGRATE_SH: /app/scripts/migrate.sh
    entrypoint: ["bash", "-c"]
    command:
      - |
        until psql "$$DB" -tAc "select to_regclass('auth.users')" | grep -q auth; do
          echo "waiting for auth schema..."; sleep 2;
        done
        if ! psql "$$DB" -tAc "select to_regclass('public.user_profiles')" | grep -q user_profiles; then
          psql "$$DB" -v ON_ERROR_STOP=1 -f /app/schema.sql || exit 1;
        elif ! psql "$$DB" -tAc "select to_regclass('public.schema_migrations')" | grep -q schema_migrations; then
          bash /app/docker/db-init/adopt-ledger.sh || exit 1;
        fi
        bash /app/scripts/migrate.sh up || exit 1;
        psql "$$DB" -c "grant usage on schema public to service_role;
          grant all privileges on all tables in schema public to service_role;
          grant all privileges on all sequences in schema public to service_role;
          notify pgrst, 'reload schema';"
    restart: "no"
    logging: *default-logging

  # Optional one-shot workflow catalogue sync. GitHub may be slow or blocked
  # from mainland ECS; run it explicitly when you want the stock workflows:
  #   ./scripts/compose.sh --profile workflows run --rm workflow-sync
  workflow-sync:
    build: *backend-build
    image: "${LINKMAI_IMAGE_REPO:-linkmai}/linkmai-backend:${LINKMAI_IMAGE_TAG:-prod}"
    profiles: ["workflows"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:?}"
      STORAGE_DRIVER: oss
      OSS_BUCKET_NAME: "${OSS_BUCKET_NAME:?}"
      OSS_REGION: "${OSS_REGION:-cn-hangzhou}"
      OSS_INTERNAL: "${OSS_INTERNAL:-true}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
      OSS_PUBLIC_ENDPOINT: "${OSS_PUBLIC_ENDPOINT:?}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:?}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:?}"
    command: ["npm", "run", "sync:workflows"]
    restart: "no"
    logging: *default-logging

  backend:
    build: *backend-build
    image: "${LINKMAI_IMAGE_REPO:-linkmai}/linkmai-backend:${LINKMAI_IMAGE_TAG:-prod}"
    env_file: .env.prod
    environment:
      <<: *backend-env
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
      rest:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        LINKMAI_VERSION: ${LINKMAI_VERSION:-linkmai}
        GIT_SHA: ${GIT_SHA:-}
        NEXT_PUBLIC_LINKMAI_SITE_URL: "${LINKMAI_SITE_URL:?}"
        NEXT_PUBLIC_LINKMAI_SUPPORT_EMAIL: "${LINKMAI_SUPPORT_EMAIL:?}"
        NEXT_PUBLIC_LINKMAI_TERMS_URL: "${LINKMAI_TERMS_URL:-}"
        NEXT_PUBLIC_LINKMAI_PRIVACY_URL: "${LINKMAI_PRIVACY_URL:-}"
    image: "${LINKMAI_IMAGE_REPO:-linkmai}/linkmai-frontend:${LINKMAI_IMAGE_TAG:-prod}"
    environment:
      API_BASE_URL: http://backend:3001
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_DISABLED: "${SENTRY_DISABLED:-true}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # TLS terminator and single public entry point (80/443 only).
  edge:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      gateway:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?run deploy/scripts/generate-secrets.mjs}"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

volumes:
  db_data:
  redis_data:
