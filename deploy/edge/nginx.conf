# LinkMai edge: TLS termination and the only published ports (80/443).
#
# Hostnames are fixed to the deployment this repository targets. If you deploy
# under different names, change server_name and the certificate paths here and
# the three public URLs in deploy/.env.prod; the rest of the stack is
# hostname-agnostic.
#
#   linkmai.com       /auth/v1/*  -> gateway (GoTrue)
#                     /api/*      -> frontend (Next route handler, then backend)
#                     /*          -> frontend
#   www.linkmai.com   301         -> https://linkmai.com
#   word.linkmai.com  /*          -> word (static task pane + /api proxy)
#   registry.linkmai.com /*       -> registry (container images pushed by CI)
#
# storage.linkmai.com is NOT proxied here: it is a CNAME to the OSS bucket, so
# browser uploads and downloads never pass through ECS.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
worker_rlimit_nofile 4096;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Re-resolve service names so recreating a container does not leave nginx
    # pinned to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Redirect plain HTTP before any certificate is served.
    server {
        listen 80;
        server_name linkmai.com www.linkmai.com word.linkmai.com;
        return 301 https://$host$request_uri;
    }

    # Canonical host: www is a permanent redirect to the apex domain. This
    # server still needs its own certificate for the initial TLS handshake.
    server {
        listen 443 ssl;
        http2 on;
        server_name www.linkmai.com;

        ssl_certificate     /etc/nginx/certs/www.linkmai.com.pem;
        ssl_certificate_key /etc/nginx/certs/www.linkmai.com.key;

        return 301 https://linkmai.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name linkmai.com;

        ssl_certificate     /etc/nginx/certs/linkmai.com.pem;
        ssl_certificate_key /etc/nginx/certs/linkmai.com.key;
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 100m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # GoTrue confirmation/recovery links land here. The gateway strips
        # /auth/v1 before forwarding to auth:9999.
        location /auth/v1/ {
            set $gateway_upstream gateway:8000;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
        }

        # Server-sent events and streaming chat responses must not be buffered.
        location /api/ {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }

    # Container image registry. The release workflow pushes here from the CI
    # runner and the host pulls from here, so nothing is ever built on the
    # 2 vCPU / 4 GiB production machine. Layer uploads are large and slow:
    # buffering is off and the body limit is lifted.
    server {
        listen 443 ssl;
        http2 on;
        server_name registry.linkmai.com;

        ssl_certificate     /etc/nginx/certs/registry.linkmai.com.pem;
        ssl_certificate_key /etc/nginx/certs/registry.linkmai.com.key;

        client_max_body_size 0;

        location / {
            set $registry_upstream registry:5000;
            proxy_pass http://$registry_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # The registry builds blob-upload Location URLs from these headers.
            # Without them it hands docker an http:// URL and the upload dies.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name word.linkmai.com;

        ssl_certificate     /etc/nginx/certs/word.linkmai.com.pem;
        ssl_certificate_key /etc/nginx/certs/word.linkmai.com.key;
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 100m;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The task pane is same-origin with its /api proxy, so cookies set by
        # the backend for word.linkmai.com stay first-party in Office.
        location / {
            set $word_upstream word:3200;
            proxy_pass http://$word_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
