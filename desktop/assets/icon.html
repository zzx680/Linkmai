<!doctype html>
<!--
  Source of truth for the LinkMai.app icon: the supplied LinkMai "M" mark
  (desktop/assets/icon-mark.png) on a white macOS-style plate.
  Rendered to 1024×1024 PNG by scripts/render-icon.js, then iconutil → icon.icns.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="#ffffff" />
      <image x="277" y="277" width="470" height="470" href="icon-mark.png" />
    </svg>
  </body>
</html>
