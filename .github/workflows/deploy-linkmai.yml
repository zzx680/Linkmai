name: Deploy LinkMai

# Builds the three images on the runner and releases the tag on the production
# host. The host never builds: compiling the frontend on the 2 vCPU / 4 GiB
# machine is what took it offline on 2026-11-25 (no swap, no memory limits).
#
# Required repository secrets:
#   PROD_SSH_HOST, PROD_SSH_USER, PROD_SSH_PORT
#   PROD_SSH_PRIVATE_KEY, PROD_SSH_KNOWN_HOSTS
#   REGISTRY_USERNAME, REGISTRY_PASSWORD   (htpasswd entry in deploy/registry-auth)

on:
  push:
    branches:
      - feat/linkmai-rebrand
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkmai-production
  cancel-in-progress: false

env:
  REGISTRY: registry.linkmai.com
  IMAGE_PREFIX: registry.linkmai.com/linkmai

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          tags: ${{ env.IMAGE_PREFIX }}/linkmai-backend:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          tags: ${{ env.IMAGE_PREFIX }}/linkmai-frontend:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build word add-in
        uses: docker/build-push-action@v6
        with:
          context: .
          file: word-addin/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            REACT_APP_WEB_APP_URL=https://linkmai.com
            WORD_ADDIN_PUBLIC_URL=https://word.linkmai.com
            REACT_APP_LINKMAI_SUPPORT_EMAIL=support@linkmai.com
            GIT_SHA=${{ github.sha }}
            LINKMAI_VERSION=${{ github.run_number }}
          tags: ${{ env.IMAGE_PREFIX }}/linkmai-word-addin:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=word-addin
          cache-to: type=gha,mode=max,scope=word-addin

  deploy:
    name: Release on production host
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deploy configuration
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'deploy/.env.prod' \
            --exclude 'deploy/.env.rds' \
            --exclude 'deploy/.release-tag' \
            --exclude 'deploy/.release-tag.prev' \
            --exclude 'deploy/certs/' \
            --exclude 'deploy/registry-auth/' \
            --exclude 'deploy/backups/' \
            --exclude 'deploy/data/' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            -e "ssh -p $PROD_SSH_PORT -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$PROD_SSH_USER@$PROD_SSH_HOST:/opt/linkmai/"

      - name: Pull images and restart
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -p "$PROD_SSH_PORT" -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$PROD_SSH_USER@$PROD_SSH_HOST" 'set -euo pipefail
              cd /opt/linkmai
              ./deploy/scripts/release.sh '"$TAG"'

      - name: Verify public health endpoint
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 10 https://linkmai.com/api/health; then
              exit 0
            fi
            sleep 10
          done
          echo "health check failed; recent backend logs:" >&2
          ssh -p "$PROD_SSH_PORT" -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'cd /opt/linkmai && ./deploy/scripts/compose.sh logs --tail=80 backend || true'
          exit 1
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}

      - name: Roll back to the previous tag
        if: failure()
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          ssh -p "$PROD_SSH_PORT" -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$PROD_SSH_USER@$PROD_SSH_HOST" 'set -euo pipefail
              cd /opt/linkmai
              previous="$(cat deploy/.release-tag.prev 2>/dev/null || true)"
              if [ -z "$previous" ]; then
                echo "no previous tag recorded; leaving the stack as it is" >&2
                exit 0
              fi
              echo "rolling back to $previous"
              ./deploy/scripts/release.sh "$previous"
            '
