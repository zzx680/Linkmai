<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵迈 · 审核管理</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="brand"><img class="brand-logo" src="./linkmai-logo.png" alt="灵迈 Linkmai AI" width="284" height="53"><span>审核管理</span></div><button id="logout">退出审核</button></header>
<main><div id="error" role="alert"></div><section class="heading"><div><div class="eyebrow">REVIEW ADMIN</div><h1>律师账户与任务分配</h1></div><button id="refresh">刷新</button></section>
<section class="card"><h2>律师账户</h2><form id="memberForm" class="inline"><input id="memberPhone" type="tel" inputmode="numeric" maxlength="11" pattern="1[3-9][0-9]{9}" placeholder="律师登录手机号" required><input id="memberPassword" type="password" placeholder="初始密码，至少12字符" minlength="12" required><button>创建受邀账号</button></form><div id="members"></div></section>
<section class="card"><h2>任务分配</h2><div id="assignments"></div></section>
<section class="card"><h2>规则与法规</h2><h3>法规库</h3><p>粘贴经过核对的法规 JSON。导入后需检查原文、版本及官方来源，再审核启用。</p><form id="legalImportForm"><textarea id="legalImport" placeholder="法规 JSON，包含官方来源、有效日期、完整原文和条文" required></textarea><button>导入待审核资料</button></form><div id="legal"></div><div id="legalDocuments"></div><section id="legalSource"></section><h3>计算规则</h3><p>确认启用 compensation-v1；所选法条需适用实际案件日期和地区。</p><button id="publish">确认并启用计算规则</button><h3>地区参数</h3><form id="parameterForm"><div class="inline"><input id="parameterId" placeholder="唯一参数ID" required><input id="parameterVersion" placeholder="版本" required><select id="parameterCode"><option value="meals_daily_cents">住院伙食补助</option><option value="nutrition_daily_cents">营养费</option></select><input id="jurisdiction" placeholder="地区代码，如 CN-ZJ-HZ" required></div><div class="inline"><input id="from" type="date" required><input id="to" type="date"><input id="parameterValue" type="number" min="0" step="1" placeholder="分/日" required><button>核实后发布参数</button></div></form><div id="parameters"></div></section></main><script src="./admin.js"></script></body></html>
