server {
    listen 80;
    listen [::]:80;
    server_name PRODUCTION_API_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name PRODUCTION_API_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/PRODUCTION_API_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PRODUCTION_API_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8100/api/health;
        access_log off;
    }

    location / {
        return 404;
    }
}
