server {
    listen 80;
    listen [::]:80;
    server_name linkmai.com www.linkmai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://linkmai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkmai.com www.linkmai.com;

    ssl_certificate /etc/linkmai/certs/linkmai.com/fullchain.pem;
    ssl_certificate_key /etc/linkmai/certs/linkmai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / {
        root /var/www/linkmai-root/current/site;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:style\.css|app\.js)$ {
        root /var/www/linkmai-root/current/site;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /review {
        return 301 /review/;
    }

    location /review/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/review/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location ^~ /api/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        return 404;
    }
}
